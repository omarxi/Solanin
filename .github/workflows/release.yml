name: Build & Release AppImage & Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - name: Download appimagetool
        run: |
          curl -fL -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool
      - name: Build AppImage
        run: APPIMAGE_EXTRACT_AND_RUN=1 bash scripts/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: target/*.AppImage

  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows EXE
        run: cargo build --release
      - name: Copy portable EXE
        run: copy target\release\solanin.exe target\release\solanin-portable.exe
      - name: Build Windows Installer (solanin-setup.exe)
        run: iscc installer\solanin.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            target/release/solanin-portable.exe
            target/installer/solanin-setup.exe

  build-macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Universal macOS App
        run: bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: target/Solanin-macos.zip

  create-release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') && !cancelled() &&
      needs.build-linux-appimage.result == 'success' &&
      needs.build-windows-exe.result == 'success'
    needs: [build-linux-appimage, build-windows-exe, build-macos-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/solanin-x86_64.AppImage
            dist/**/solanin-portable.exe
            dist/**/solanin-setup.exe
            dist/**/Solanin-macos.zip
          generate_release_notes: true
